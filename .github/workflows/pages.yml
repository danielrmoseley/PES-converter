name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Smoke test: run the whole digitizing pipeline headlessly; a broken build never deploys
      - name: Test digitizing pipeline
        run: node tools/test-node.js "$RUNNER_TEMP/smoke.pes"

      - id: pages
        uses: actions/configure-pages@v6

      # Publish only the static site (no tools, tests or docs)
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js assets _site/
          touch _site/.nojekyll
          # link previews need an absolute image URL
          sed -i "s#content=\"assets/og-image.png\"#content=\"${{ steps.pages.outputs.base_url }}/assets/og-image.png\"#" _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
